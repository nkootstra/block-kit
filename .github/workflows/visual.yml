name: Visual

# Pixel-compares every fixture against its Block Kit Builder reference, and compares its text runs.
# - Pull requests fail when a fixture regresses past the base branch's
#   fixtures/visual-baseline.linux.json or fixtures/text-baseline.linux.json, so a PR can't loosen
#   its own check. A maintainer can accept a deliberate regression with the visual-baseline-increase
#   label.
# - Pushes to main record the new baseline and commit it: new fixtures and improvements always,
#   increases only when the merged PR carried the label. The commit is pushed with the
#   VISUAL_DEPLOY_KEY deploy key, the one actor the main ruleset lets push without a pull request.
# - Run manually with `update_baseline` to regenerate the whole file as an artifact.
# - Pull requests also render every fixture with the base branch's build and their own, in light
#   and dark, and upload the renders that differ as the `render-diff` artifact. The Visual preview
#   workflow (visual-preview.yml) publishes them to the pull request. This job has no secrets, also
#   for pull requests from forks.
#
# A pull request only compares when it touches something the comparison renders: the package, the
# playground that renders it, the fixtures, the harness, or the dependencies. Otherwise `compare` is
# skipped, which a required check counts as passing (a workflow-level `paths` filter would leave the
# check pending instead).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    # The baseline commit this workflow pushes needs no comparison of its own.
    paths-ignore:
      - fixtures/visual-baseline.*.json
      - fixtures/text-baseline.*.json
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Regenerate fixtures/visual-baseline.linux.json and text-baseline.linux.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Baseline commits to main queue up; a pull request only needs its latest run.
  group: visual-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LABEL: visual-baseline-increase

jobs:
  changes:
    name: Decide whether to compare
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.diff.outputs.visual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          inputs='^(packages/block-kit/|apps/playground/|fixtures/|tools/visual/|bun\.lock$|package\.json$|turbo\.json$|tsconfig\.base\.json$|\.github/workflows/visual\.yml$)'
          if git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -qE "$inputs"; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the comparison renders changed; skipping it."
            echo "visual=false" >> "$GITHUB_OUTPUT"
          fi

  compare:
    needs: changes
    # Of the label events, only this workflow's label changes the outcome.
    if: >-
      needs.changes.outputs.visual == 'true' &&
      (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
      github.event.label.name == 'visual-baseline-increase')
    runs-on: ubuntu-latest
    # A run takes about 15 minutes; a hang fails fast instead of holding a runner for six hours.
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
      pull-requests: read
    steps:
      # setup-bun unpacks Bun's release zip, and the Playwright image ships without unzip. Git and
      # ssh come first so checkout makes a real clone that the baseline commit can push from.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip git openssh-client
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only a push to main commits; pull requests, forks included, never see the key.
          ssh-key: ${{ github.event_name == 'push' && secrets.VISUAL_DEPLOY_KEY || '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Start playground
        run: |
          (cd apps/playground && bunx vite --host 0.0.0.0 --port 5180 --strictPort > /tmp/vite.log 2>&1 &)
          for i in $(seq 1 60); do
            bun -e 'await fetch("http://localhost:5180")' 2> /dev/null && exit 0
            sleep 1
          done
          cat /tmp/vite.log
          exit 1

      - name: Check out the base branch's baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          sparse-checkout: |
            fixtures/visual-baseline.linux.json
            fixtures/text-baseline.linux.json
          sparse-checkout-cone-mode: false
      - name: Compare
        if: github.event_name == 'pull_request'
        env:
          ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'visual-baseline-increase') && '--allow-increase' || '' }}
        run: >-
          bun tools/visual/src/compare.ts --check
          --baseline=base/fixtures/visual-baseline.linux.json
          --text-baseline=base/fixtures/text-baseline.linux.json
          $ALLOW_INCREASE

      - name: Record the baseline
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(bun -e '
            const res = await fetch(
              `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/pulls`,
              { headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" } },
            );
            if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
            const pulls = await res.json();
            console.log(pulls.flatMap((p) => p.labels.map((l) => l.name)).join("\n"));
          ')
          if grep -qx "$LABEL" <<< "$labels"; then mode=--update-baseline; else mode=--update-baseline=lower; fi
          bun tools/visual/src/compare.ts $mode
      - name: Commit the baseline
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          baselines="fixtures/visual-baseline.linux.json fixtures/text-baseline.linux.json"
          git add $baselines
          git diff --cached --quiet -- $baselines && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CI runs on this commit (a deploy key's push triggers workflows), so a release can be cut
          # from it; the push trigger's paths-ignore keeps this workflow from comparing it again.
          git commit -m "test(visual): record the Linux baseline for ${GITHUB_SHA::7}" -- $baselines
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Update baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        run: bun tools/visual/src/compare.ts --update-baseline
      - name: Compare
        if: github.event_name == 'workflow_dispatch' && !inputs.update_baseline
        run: bun tools/visual/src/compare.ts --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual
          path: |
            test-results/visual/
            fixtures/visual-baseline.linux.json
            fixtures/text-baseline.linux.json
          if-no-files-found: ignore

  render-diff:
    name: Render changed fixtures
    needs: changes
    # Label changes don't change what renders.
    if: >-
      needs.changes.outputs.visual == 'true' &&
      github.event_name == 'pull_request' &&
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    runs-on: ubuntu-latest
    # A run takes about 12 minutes; a hang fails fast instead of holding a runner for six hours.
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    # The container runs as root, but GitHub mounts HOME at /github/home owned by another user, and
    # Firefox refuses to start under a HOME it doesn't own. Playwright's documented workaround.
    env:
      HOME: /root
    permissions:
      contents: read
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends unzip git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd tools/visual test:browser
      # The base branch's library, checked out next to the workspace with its own dependencies.
      - name: Check out the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base" && bun install --frozen-lockfile
      - name: Render
        run: >-
          bun tools/visual/src/render/render-diff.ts
          --base="$RUNNER_TEMP/base/packages/block-kit"
          --out=test-results/render-diff
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-diff
          path: test-results/render-diff/
          if-no-files-found: error

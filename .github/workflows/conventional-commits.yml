name: Conventional Commits

# PR titles and commit subjects must read `type(scope): subject`, e.g.
# `fix(select): keep the chosen option after a re-render`. The scope is required and is any
# lowercase kebab-case word. A `!` after the scope marks a breaking change.
#
# The PR title is checked by pr-title.yml: every merge strategy is enabled, so
# a merge or rebase lands the commits as they are and a squash lands the title.
#
# 'edited' is left out: renaming a PR doesn't change its commits, and a
# skipped run would count as passing.
#
# Keep TYPES and PATTERN identical to pr-title.yml, and in sync with AGENTS.md
# and the template's "Type of change" boxes.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  commits:
    name: Commits follow type(scope) subject
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TYPES='feat|fix|perf|refactor|test|docs|chore|ci|build|revert'
          PATTERN="^($TYPES)\([a-z0-9][a-z0-9-]*\)!?: [^[:space:]].*\$"
          FAILED=0

          # Merge commits are skipped: their subject is generated by git.
          for sha in $(git log --no-merges --format=%H "$BASE_SHA".."$HEAD_SHA"); do
            subject=$(git show -s --format=%s "$sha")
            if [[ "$subject" =~ $PATTERN ]]; then
              echo "ok: $sha $subject"
            else
              echo "::error::Commit subject does not follow type(scope): subject: $sha $subject"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "  Allowed types: ${TYPES//|/, }"
            echo "  Scope is required: any lowercase word, e.g. select, visual, docs."
            echo "  Example: fix(select): keep the chosen option after a re-render"
            echo "  A git-generated 'Revert \"...\"' subject needs rewording to revert(scope): ..."
            echo ""
            echo "  To fix the last commit:"
            echo "    git commit --amend"
            echo "    git push --force-with-lease"
            echo ""
            echo "  To fix several, reword them in a rebase onto origin/main."
          fi

          exit $FAILED

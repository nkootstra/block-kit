name: Visual preview

# Publishes a pull request's render diff: before, after and the changes of every fixture whose
# rendering it changes, in a comment on the pull request.
# - The Visual workflow renders the fixtures and uploads the ones that changed as `render-diff`.
#   That run has no secrets, also for pull requests from forks.
# - This workflow runs main's code with the R2 credentials. publish.ts accepts the artifact only if
#   every file in it is a PNG render the manifest lists, copies the renders the comment shows to the
#   block-kit-visual bucket (cdn.block-kit.dev, deleted after 30 days) and writes the comment.
# - A run without visual changes leaves the pull request alone: no comment, no update.
on:
  workflow_run:
    workflows: [Visual]
    types: [completed]

permissions: {}

env:
  MARKER: "<!-- visual-diff -->"

jobs:
  publish:
    name: Publish the render diff
    # A failing comparison against Slack still produced a render diff worth seeing.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: visual-preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - id: pr
        env:
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          artifact=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "render-diff") | .id')
          if [ -z "$artifact" ]; then
            echo "Visual didn't render $HEAD_SHA; nothing to publish."
            exit 0
          fi
          # workflow_run lists no pull requests for forks, so look the pull request up by its head.
          number=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq '.[] | select(.head.sha == env.HEAD_SHA) | .number' | head -n 1)
          if [ -z "$number" ]; then
            echo "$HEAD_SHA is not the head of an open pull request; skipping."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The default branch: the publish script this runs.
      - if: steps.pr.outputs.number
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.pr.outputs.number
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The renders come from the pull request, so they land outside the workspace, where they can't
      # replace a file this job runs. publish.ts refuses symlinks and anything that isn't a render.
      - if: steps.pr.outputs.number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: render-diff
          path: ${{ runner.temp }}/render-diff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: publish
        if: steps.pr.outputs.number
        name: Upload the renders
        env:
          PR: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun tools/visual/src/render/publish.ts \
            --artifact="$RUNNER_TEMP/render-diff" \
            --pr="$PR" --sha="$HEAD_SHA" --run-url="$RUN_URL" \
            --body="$RUNNER_TEMP/comment.md"
          if [ -f "$RUNNER_TEMP/comment.md" ]; then echo "comment=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.publish.outputs.comment
        name: Comment
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' |
            head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi

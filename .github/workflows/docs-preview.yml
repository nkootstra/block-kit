name: Docs preview

# Deploys a pull request's docs as a Cloudflare Workers Preview when a maintainer comments
# `/preview` on it, and keeps one comment on the pull request up to date with its state and URL.
# - CI builds the docs when a pull request affects them and uploads the build as `docs-preview`.
#   That run has no secrets, also for pull requests from forks.
# - When CI passes, `announce` updates the comment: the build is ready, comment `/preview`.
# - `preview` runs on a pull request comment that is exactly `/preview`. It deploys only for a
#   commenter whose repository role is admin, maintain or write (checked with the collaborators
#   API; scripts/preview-command.ts), and only the pull request's current head, once CI built it.
#   It reacts 👀 when it starts, 🚀 when deployed and 😕 when it refuses or fails, and replies why.
# - The deploy takes only the built files from the pull request. issue_comment runs this file from
#   the default branch, and the job checks out main, so the Worker, wrangler.jsonc, Wrangler and
#   the scripts come from main: a pull request can't change what runs with the Cloudflare token or
#   where it deploys. Nothing from the comment or the pull request reaches a shell except through
#   quoted environment variables. Changes to the Worker show up in previews once they merge.
# - Closing the pull request deletes its Preview and marks its old docs-preview deployments
#   inactive. That runs on pull_request_target, which never checks out the pull request's code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions: {}

env:
  MARKER: "<!-- docs-preview -->"
  WORKER: block-kit-docs

jobs:
  announce:
    name: Find the pull request
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          artifact=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "docs-preview") | .id')
          if [ -z "$artifact" ]; then
            echo "CI didn't build the docs for $HEAD_SHA; nothing to preview."
            exit 0
          fi
          # workflow_run lists no pull requests for forks, so look the pull request up by its head.
          number=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq '.[] | select(.head.sha == env.HEAD_SHA) | .number' | head -n 1)
          if [ -z "$number" ]; then
            echo "$HEAD_SHA is not the head of an open pull request; skipping."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          body="$MARKER
          ### Docs preview

          The docs for $HEAD_SHA are built. A maintainer can deploy them by commenting \`/preview\`."
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' |
            head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  preview:
    name: Deploy the preview
    # The exact match is checked below; this only skips jobs for unrelated comments.
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: docs-preview-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      # The default branch: the scripts, the Worker and wrangler.jsonc this deploys with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Who may deploy: the commenter's repository role, not the comment's author_association,
      # which says how someone relates to the repository rather than whether they may push.
      - id: gate
        env:
          BODY: ${{ github.event.comment.body }}
          LOGIN: ${{ github.event.comment.user.login }}
          USER_TYPE: ${{ github.event.comment.user.type }}
        run: |
          ROLE=$(gh api "repos/$REPO/collaborators/$LOGIN/permission" --jq .role_name 2>/dev/null ||
            echo none)
          export ROLE
          bun scripts/preview-command.ts

      - if: steps.gate.outputs.command == 'true' && steps.gate.outputs.allowed != 'true'
        run: |
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused > /dev/null
          gh api "repos/$REPO/issues/$PR/comments" -f body="Only maintainers can deploy previews." > /dev/null

      - if: steps.gate.outputs.allowed == 'true'
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null

      # The pull request's head now, and the CI run that built its docs. A /preview before CI
      # finishes gets a reply to comment again once it's green.
      - id: build
        if: steps.gate.outputs.allowed == 'true'
        run: |
          reply() {
            gh api "repos/$REPO/issues/$PR/comments" -f body="$1" > /dev/null
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused > /dev/null
          }
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"')
          sha=${state#* }
          if [ "${state%% *}" != open ]; then
            reply "This pull request is closed, so there's nothing to preview."
            exit 0
          fi
          run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.status) \(.conclusion)"')
          read -r run_id status conclusion <<< "$run"
          if [ -z "$run_id" ] || [ "$run_id" = null ] || [ "$status" != completed ]; then
            reply "CI hasn't finished for $sha yet. Comment \`/preview\` again once it's green."
            exit 0
          fi
          if [ "$conclusion" != success ]; then
            reply "CI failed for $sha, so there's no build to preview."
            exit 0
          fi
          artifact=$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | select(.name == "docs-preview") | .id')
          if [ -z "$artifact" ]; then
            reply "This pull request doesn't change the docs, so there's nothing to preview."
            exit 0
          fi
          {
            echo "sha=$sha"
            echo "run=$run_id"
          } >> "$GITHUB_OUTPUT"

      # main's lockfile: the Worker bundles Blume's MCP handler and its dependencies. No lifecycle
      # scripts run here.
      - if: steps.build.outputs.run
        run: bun install --frozen-lockfile --ignore-scripts
      # The build comes from the pull request, so it lands outside the workspace, where it can't
      # replace a file this job runs. Wrangler uploads every file under dist/, so a symlink could
      # publish a file from the runner; refuse any.
      - if: steps.build.outputs.run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-preview
          path: ${{ runner.temp }}/docs-preview
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
      - if: steps.build.outputs.run
        run: |
          build="$RUNNER_TEMP/docs-preview"
          if [ -n "$(find "$build" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::The docs build contains something other than files and directories."
            exit 1
          fi
          cp -R "$build" apps/docs/dist

      - id: deploy
        if: steps.build.outputs.run
        name: Deploy to a Cloudflare Workers Preview
        working-directory: apps/docs
        env:
          HEAD_SHA: ${{ steps.build.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          bunx wrangler@4 preview --name "pr-$PR" --message "$HEAD_SHA"
          url=$(jq -r 'select(.type == "preview") | .preview_urls[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::The Preview has no URL. Is \"preview_urls\" deployed to production?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.deploy.outputs.url
        env:
          URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          body="$MARKER
          ### Docs preview

          The docs for $HEAD_SHA are deployed to $URL

          After a new push, a maintainer can comment \`/preview\` to update it."
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' |
            head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket > /dev/null

      - if: failure() && steps.gate.outputs.allowed == 'true'
        run: gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused > /dev/null

  cleanup:
    name: Delete the preview
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Only a pull request this workflow commented on can have a Preview.
      - id: comment
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' |
            head -n 1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - if: steps.comment.outputs.id
        name: Delete the Cloudflare Workers Preview
        # bash with pipefail, so a failed delete fails the `if` despite the tee.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # No maintainer may have deployed one; Cloudflare answers 10025 for a missing Preview.
          if ! npx --yes wrangler@4 preview delete --worker-name "$WORKER" --name "pr-$PR" \
            --skip-confirmation 2>&1 | tee "$RUNNER_TEMP/delete.log"; then
            grep -q "code: 10025" "$RUNNER_TEMP/delete.log" || exit 1
          fi

      # Every deployment runs from main, so only its Preview URL tells which pull request it was.
      - if: steps.comment.outputs.id
        name: Mark the pull request's deployments inactive
        # bash with pipefail, so a failed listing fails the step.
        shell: bash
        run: |
          gh api --paginate "repos/$REPO/deployments?environment=docs-preview" --jq '.[].id' |
            while read -r id; do
              url=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" \
                --jq '.[0] | select(.state == "success") | .environment_url')
              case "$url" in
                "https://pr-$PR-$WORKER."*)
                  gh api "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null ;;
              esac
            done

      - if: steps.comment.outputs.id
        env:
          ID: ${{ steps.comment.outputs.id }}
        run: |
          body="$MARKER
          ### Docs preview

          This pull request closed, so its preview is gone."
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$body" > /dev/null

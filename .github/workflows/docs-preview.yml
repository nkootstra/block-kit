name: Docs preview

# Deploys a pull request's docs as a Cloudflare Workers Preview once a maintainer approves it, and
# keeps one comment on the pull request up to date with its state and URL.
# - CI builds the docs when a pull request affects them and uploads the build as `docs-preview`.
#   That run has no secrets, also for pull requests from forks.
# - When CI passes, `announce` comments that a preview is waiting, linking to this run. `deploy`
#   then waits for a required reviewer of the docs-preview environment to approve it. Every push
#   runs CI again and needs its own approval, so approving one commit never deploys a later one, and
#   `deploy` skips a commit that is no longer the pull request's head.
# - `deploy` takes only the built files from the pull request. The Worker, wrangler.jsonc and
#   Wrangler come from main, so a pull request can't change what runs with the Cloudflare token or
#   where it deploys. Changes to the Worker show up in previews once they merge.
# - Closing the pull request deletes its Preview and marks its docs-preview deployments inactive.
#   That runs on pull_request_target, which never checks out the pull request's code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions: {}

env:
  MARKER: "<!-- docs-preview -->"
  WORKER: block-kit-docs

jobs:
  announce:
    name: Find the pull request
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          artifact=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "docs-preview") | .id')
          if [ -z "$artifact" ]; then
            echo "CI didn't build the docs for $HEAD_SHA; nothing to preview."
            exit 0
          fi
          # workflow_run lists no pull requests for forks, so look the pull request up by its head.
          number=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq '.[] | select(.head.sha == env.HEAD_SHA) | .number' | head -n 1)
          if [ -z "$number" ]; then
            echo "$HEAD_SHA is not the head of an open pull request; skipping."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$MARKER
          ### Docs preview

          The docs for $HEAD_SHA are ready to preview. A maintainer can deploy them by approving the
          [docs-preview deployment]($RUN_URL)."
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' |
            head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  deploy:
    name: Deploy the preview
    needs: announce
    if: needs.announce.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    environment:
      name: docs-preview
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: docs-preview-${{ needs.announce.outputs.pr }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ needs.announce.outputs.pr }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Approval can come long after the run started; deploy only what is still the head.
      - id: current
        run: |
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"')
          if [ "$state" != "open $HEAD_SHA" ]; then
            echo "Pull request #$PR moved on from $HEAD_SHA ($state); its newer run deploys instead."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # The default branch: the Worker and wrangler.jsonc this deploys with.
      - if: steps.current.outputs.deploy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.current.outputs.deploy
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # main's lockfile: the Worker bundles Blume's MCP handler and its dependencies. No lifecycle
      # scripts run here.
      - if: steps.current.outputs.deploy
        run: bun install --frozen-lockfile --ignore-scripts
      # The build comes from the pull request, so it lands outside the workspace, where it can't
      # replace a file this job runs. Wrangler uploads every file under dist/, so a symlink could
      # publish a file from the runner; refuse any.
      - if: steps.current.outputs.deploy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-preview
          path: ${{ runner.temp }}/docs-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.current.outputs.deploy
        run: |
          build="$RUNNER_TEMP/docs-preview"
          if [ -n "$(find "$build" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::The docs build contains something other than files and directories."
            exit 1
          fi
          cp -R "$build" apps/docs/dist

      - id: deploy
        if: steps.current.outputs.deploy
        name: Deploy to a Cloudflare Workers Preview
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          bunx wrangler@4 preview --name "pr-$PR" --message "$HEAD_SHA"
          url=$(jq -r 'select(.type == "preview") | .preview_urls[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::The Preview has no URL. Is \"preview_urls\" deployed to production?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.deploy.outputs.url
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          body="$MARKER
          ### Docs preview

          The docs for $HEAD_SHA are deployed to $URL

          A new commit needs a maintainer's approval before its preview replaces this one."
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' |
            head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  cleanup:
    name: Delete the preview
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Only a pull request this workflow commented on can have a Preview.
      - id: comment
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' |
            head -n 1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - if: steps.comment.outputs.id
        name: Delete the Cloudflare Workers Preview
        # bash with pipefail, so a failed delete fails the `if` despite the tee.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # No maintainer may have approved a deploy; Cloudflare answers 10025 for a missing Preview.
          if ! npx --yes wrangler@4 preview delete --worker-name "$WORKER" --name "pr-$PR" \
            --skip-confirmation 2>&1 | tee "$RUNNER_TEMP/delete.log"; then
            grep -q "code: 10025" "$RUNNER_TEMP/delete.log" || exit 1
          fi

      # Every deployment runs from main, so only its Preview URL tells which pull request it was.
      - if: steps.comment.outputs.id
        name: Mark the pull request's deployments inactive
        # bash with pipefail, so a failed listing fails the step.
        shell: bash
        run: |
          gh api --paginate "repos/$REPO/deployments?environment=docs-preview" --jq '.[].id' |
            while read -r id; do
              url=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" \
                --jq '.[0] | select(.state == "success") | .environment_url')
              case "$url" in
                "https://pr-$PR-$WORKER."*)
                  gh api "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null ;;
              esac
            done

      - if: steps.comment.outputs.id
        env:
          ID: ${{ steps.comment.outputs.id }}
        run: |
          body="$MARKER
          ### Docs preview

          This pull request closed, so its preview is gone."
          gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$body" > /dev/null

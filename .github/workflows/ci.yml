name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run build
      - run: bun run type-check
      - run: bun run test
      # Every reference snapshot must still show Slack's rendering of its fixture's payload.
      - run: bun run references:check
      # Hand the docs build to deploy-docs, so it ships exactly what passed the checks.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist
          # Keep .well-known/, which the site's discovery links point to.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-docs:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://block-kit.kootstra.io
    # Let a deploy finish rather than cancel it half-uploaded; the next one queues behind it.
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist
      - name: Deploy to Cloudflare Workers
        working-directory: apps/docs
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

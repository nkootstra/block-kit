name: CI

# Pull requests build, type-check and test only the workspaces their changes affect, per Turbo's
# graph: a docs change runs the docs, a package change everything that depends on the package.
# turbo.json's globalDependencies make root manifests, bun.lock and tsconfig.base.json affect every
# workspace; other files outside the workspaces (fixtures/, .github/, docs/) affect none. Format,
# lint and the reference check always run. Pushes to main run everything, because the Release
# workflow requires this workflow to have passed on the commit it publishes.
#
# The docs, the landing page and the playground deploy with releases, never on a plain push, so
# they don't describe a package npm doesn't have yet. After publishing, the Release workflow runs
# this workflow on the new vX.Y.Z tag with `deploy`, which deploys that tag (its changelog shows
# the release). A maintainer can run it on main with `deploy` for a docs-only fix;
# scripts/deploy-guard.ts refuses that when packages/block-kit changed since the latest release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the docs, landing page and playground (a release tag, or main without package changes)
        type: boolean
        default: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --affected diffs against the base branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bunx turbo run build type-check test $AFFECTED
        env:
          AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          # The checkout has origin/main but no local main, so Turbo can't find the base on its own
          # and would treat every workspace as affected.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          # The docs' changelog reads the GitHub releases; anonymous requests are rate limited.
          GITHUB_TOKEN: ${{ github.token }}
      # Every reference snapshot must still show Slack's rendering of its fixture's payload.
      - run: bun run references:check
      # How many of the states Slack should be compared in have a reference, and which
      # interactions have a recorded payload. A report on the job's summary; it doesn't fail.
      - name: Visual coverage
        run: |
          bun tools/visual/src/coverage.ts > /dev/null
          cat test-results/visual/coverage.md >> "$GITHUB_STEP_SUMMARY"
      # The release and preview helpers the workflows run.
      - run: bun test scripts
      # Hand the docs build to deploy-docs, so it ships exactly what passed the checks.
      - if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: apps/docs/dist
          # Keep .well-known/, which the site's discovery links point to.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7
      - if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-dist
          path: apps/playground/dist
          if-no-files-found: error
          retention-days: 7
      # A pull request that rebuilt the docs hands its build to docs-preview.yml, which deploys it
      # as a Preview once a maintainer approves. Turbo builds the docs only when the change affects
      # them, so other pull requests upload nothing.
      - if: github.event_name == 'pull_request' && hashFiles('apps/docs/dist/index.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview
          path: apps/docs/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-docs:
    needs: check
    # Checks out the repository; the deploy authenticates with the Cloudflare secret, not this token.
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://docs.block-kit.dev
    # Let a deploy finish rather than cancel it half-uploaded; the next one queues behind it.
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Releases deploy; see the note at the top and scripts/deploy-guard.ts.
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          MAIN_HEAD=$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)
          LATEST_TAG=$(git ls-remote --tags --refs "$REPO_URL" 'v*' | cut -f2 | sed 's#^refs/tags/##' |
            sort -V | tail -n 1)
          PACKAGE_CHANGED=
          if [ "$REF" = refs/heads/main ] && [ -n "$LATEST_TAG" ]; then
            # The compare API lists at most 300 files; a bigger change counts as touching the package.
            PACKAGE_CHANGED=$(gh api "repos/$GH_REPO/compare/$LATEST_TAG...$SHA" --jq \
              '(.files | length) >= 300 or any(.files[]; .filename | startswith("packages/block-kit/"))')
          fi
          export MAIN_HEAD LATEST_TAG PACKAGE_CHANGED
          bun scripts/deploy-guard.ts
      - if: steps.guard.outputs.deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: apps/docs/dist
      # The Worker bundles Blume's MCP handler and its dependencies. No lifecycle scripts run here.
      - if: steps.guard.outputs.deploy == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - if: steps.guard.outputs.deploy == 'true'
        name: Deploy to Cloudflare Workers
        working-directory: apps/docs
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-site:
    needs: check
    permissions:
      contents: read
    # Its live demos render with the package, so it deploys with releases too.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://block-kit.dev
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Releases deploy; see the note at the top and scripts/deploy-guard.ts.
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          MAIN_HEAD=$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)
          LATEST_TAG=$(git ls-remote --tags --refs "$REPO_URL" 'v*' | cut -f2 | sed 's#^refs/tags/##' |
            sort -V | tail -n 1)
          PACKAGE_CHANGED=
          if [ "$REF" = refs/heads/main ] && [ -n "$LATEST_TAG" ]; then
            # The compare API lists at most 300 files; a bigger change counts as touching the package.
            PACKAGE_CHANGED=$(gh api "repos/$GH_REPO/compare/$LATEST_TAG...$SHA" --jq \
              '(.files | length) >= 300 or any(.files[]; .filename | startswith("packages/block-kit/"))')
          fi
          export MAIN_HEAD LATEST_TAG PACKAGE_CHANGED
          bun scripts/deploy-guard.ts
      - if: steps.guard.outputs.deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: apps/site/dist
      # Static files only, so nothing needs installing besides Wrangler itself.
      - if: steps.guard.outputs.deploy == 'true'
        name: Deploy to Cloudflare Workers
        working-directory: apps/site
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-playground:
    needs: check
    permissions:
      contents: read
    # The playground renders with the package, so it deploys with releases too.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: playground
      url: https://play.block-kit.dev
    concurrency:
      group: deploy-playground
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Releases deploy; see the note at the top and scripts/deploy-guard.ts.
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          MAIN_HEAD=$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)
          LATEST_TAG=$(git ls-remote --tags --refs "$REPO_URL" 'v*' | cut -f2 | sed 's#^refs/tags/##' |
            sort -V | tail -n 1)
          PACKAGE_CHANGED=
          if [ "$REF" = refs/heads/main ] && [ -n "$LATEST_TAG" ]; then
            # The compare API lists at most 300 files; a bigger change counts as touching the package.
            PACKAGE_CHANGED=$(gh api "repos/$GH_REPO/compare/$LATEST_TAG...$SHA" --jq \
              '(.files | length) >= 300 or any(.files[]; .filename | startswith("packages/block-kit/"))')
          fi
          export MAIN_HEAD LATEST_TAG PACKAGE_CHANGED
          bun scripts/deploy-guard.ts
      - if: steps.guard.outputs.deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playground-dist
          path: apps/playground/dist
      # Static files only, so nothing needs installing besides Wrangler itself.
      - if: steps.guard.outputs.deploy == 'true'
        name: Deploy to Cloudflare Workers
        working-directory: apps/playground
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

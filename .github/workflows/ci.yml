name: CI

# Pull requests build, type-check and test only the workspaces their changes affect, per Turbo's
# graph: a docs change runs the docs, a package change everything that depends on the package.
# turbo.json's globalDependencies make root manifests, bun.lock and tsconfig.base.json affect every
# workspace; other files outside the workspaces (fixtures/, .github/, docs/) affect none. Format,
# lint and the reference check always run. Pushes to main run everything, because the Release
# workflow requires this workflow to have passed on the commit it publishes. The Release workflow
# also runs it on main after publishing, so the docs rebuild and their changelog shows the release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site-changed: ${{ steps.site.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --affected diffs against the base branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bunx turbo run build type-check test $AFFECTED
        env:
          AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          # The checkout has origin/main but no local main, so Turbo can't find the base on its own
          # and would treat every workspace as affected.
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          # The docs' changelog reads the GitHub releases; anonymous requests are rate limited.
          GITHUB_TOKEN: ${{ github.token }}
      # Every reference snapshot must still show Slack's rendering of its fixture's payload.
      - run: bun run references:check
      # Hand the docs build to deploy-docs, so it ships exactly what passed the checks.
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: apps/docs/dist
          # Keep .well-known/, which the site's discovery links point to.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # The landing page deploys only when a push to main changed apps/site or the package its demos
      # render with. A manual run, or a push whose previous commit isn't in the history (a force
      # push), deploys it regardless.
      - id: site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- apps/site packages/block-kit; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
      - if: steps.site.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7
      # A pull request that rebuilt the docs hands its build to docs-preview.yml, which deploys it
      # as a Preview once a maintainer approves. Turbo builds the docs only when the change affects
      # them, so other pull requests upload nothing.
      - if: github.event_name == 'pull_request' && hashFiles('apps/docs/dist/index.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview
          path: apps/docs/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-docs:
    needs: check
    # Checks out the repository; the deploy authenticates with the Cloudflare secret, not this token.
    permissions:
      contents: read
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://docs.block-kit.dev
    # Let a deploy finish rather than cancel it half-uploaded; the next one queues behind it.
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: apps/docs/dist
      # The Worker bundles Blume's MCP handler and its dependencies. No lifecycle scripts run here.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Deploy to Cloudflare Workers
        working-directory: apps/docs
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-site:
    needs: check
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.check.outputs.site-changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://block-kit.dev
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: apps/site/dist
      # Static files only, so nothing needs installing besides Wrangler itself.
      - name: Deploy to Cloudflare Workers
        working-directory: apps/site
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

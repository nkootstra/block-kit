# Workflow actions are pinned to commit SHAs where the release and PR checks use them, so nothing
# moves under us. Dependabot proposes updates as reviewable PRs, bumping the SHA or tag together
# with its version comment.
#
# Commit subjects must read `type(scope): subject` (conventional-commits.yml): the prefix is the
# type and `include: scope` adds `(deps)`.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release gets a week in the wild before we take it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

name: Bug report
description: Something renders or behaves differently from Slack, or doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues don't belong here: report them privately as described in [SECURITY.md](https://github.com/nkootstra/block-kit/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What Slack shows, and what the package shows instead. Screenshots of both help most.
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: Block Kit JSON
      description: The smallest payload that shows the problem. A Block Kit Builder link works too.
      render: json
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Anything beyond rendering the payload, such as clicking a button or the props you pass.
  - type: input
    id: version
    attributes:
      label: Package version
      description: From your lockfile or `npm ls @nkootstra/block-kit`.
    validations:
      required: true
  - type: input
    id: react
    attributes:
      label: React version
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome on macOS"
